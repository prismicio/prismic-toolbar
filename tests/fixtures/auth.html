<!doctype html>
<meta charset="utf-8" />
<title>Repository iframe fixture</title>
<iframe src="/prismic-toolbar/__VERSION__/iframe.html"></iframe>
<output id="state">Waiting for iframe</output>
<script>
	document.querySelector("iframe").onload = (event) => {
		const channel = new MessageChannel()
		channel.port1.onmessage = ({ data }) => {
			if (data.type === "prismic-toolbar:ready") {
				channel.port1.postMessage({ id: 1, method: "getState", params: [] })
			} else {
				document.querySelector("#state").textContent = JSON.stringify(data)
			}
		}
		// Unrelated messages, such as those from browser extensions, are ignored.
		event.target.contentWindow.postMessage("noise", "*")
		event.target.contentWindow.postMessage({ type: "prismic-toolbar:connect" }, "*", [
			channel.port2,
		])
	}
</script>
