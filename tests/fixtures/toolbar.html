<!doctype html>
<meta charset="utf-8" />
<title>Preview bar fixture</title>
<style>
	body {
		font: 16px sans-serif;
		padding: 24px;
	}
	.bar,
	.title {
		color: rgb(255, 0, 0);
	}
</style>
<h1>Customer page</h1>
<p class="title" id="host-sentinel">Host styles stay isolated</p>
<script>
	// A fake preview session, so the bar renders without a repository.
	const listeners = new Set()
	let snapshot = {
		status: "polling",
		authenticated: new URLSearchParams(location.search).get("auth") !== "false",
		preview: { ref: "ref-1", title: "Spring launch" },
	}
	window.fixture = {
		exits: 0,
		shares: 0,
		shareResult: "https://fixture.prismic.io/previews/s/abc",
		setSnapshot(next) {
			snapshot = next
			for (const listener of listeners) listener(snapshot)
		},
	}
	window.fixtureSession = {
		getSnapshot: () => snapshot,
		subscribe(listener) {
			listeners.add(listener)
			return () => listeners.delete(listener)
		},
		async exit() {
			window.fixture.exits++
			window.fixture.setSnapshot({ status: "idle", authenticated: snapshot.authenticated })
		},
		async share() {
			window.fixture.shares++
			return window.fixture.shareResult
		},
	}
</script>
<script src="/prismic-toolbar/__VERSION__/toolbar.js"></script>
<script>
	window.__prismicToolbar.mountToolbar({
		session: window.fixtureSession,
		repositoryHost: "fixture.prismic.io",
	})
</script>
