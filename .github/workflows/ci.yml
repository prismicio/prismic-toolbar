name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run types
      - run: npm run lint
      - run: npm run format -- --check
      - run: npm run unit
      - run: npm run build
      - run: npm run bundlewatch
        env:
          BUNDLEWATCH_GITHUB_TOKEN: ${{ secrets.BUNDLEWATCH_GITHUB_TOKEN }}
          CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/

  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      toolbar: ${{ steps.diff.outputs.toolbar }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check whether the toolbar changed
        id: diff
        # Merges that only touch docs, tests or the playground are not deployed. An unknown previous
        # commit makes `git diff` fail, which counts as a change.
        run: |
          if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- src package.json package-lock.json vite.config.ts scripts/build.ts; then
            echo "toolbar=false" >> "$GITHUB_OUTPUT"
          else
            echo "toolbar=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          BEFORE: ${{ github.event.before }}

  deploy:
    needs: [check, changes]
    if: needs.changes.outputs.toolbar == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Name the deploy after its commit
        run: echo "TOOLBAR_VERSION=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
      - name: Build for production
        run: npm run build
        env:
          CDN_HOST: https://prismic.io
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0, fixed commit for security reasons
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload the commit's build artifacts
        # Change immutable assets to max-age=31536000 (1 year) after testing.
        run: |
          aws s3 sync "dist/prismic-toolbar/$TOOLBAR_VERSION" "s3://${{ secrets.BUCKET_PATH }}/$TOOLBAR_VERSION"             --exclude "prismic.js"             --acl public-read             --cache-control "public, max-age=86400, immutable"

          aws s3 cp "dist/prismic-toolbar/$TOOLBAR_VERSION/prismic.js" "s3://${{ secrets.BUCKET_PATH }}/$TOOLBAR_VERSION/prismic.js"             --acl public-read             --cache-control "public, max-age=0, s-maxage=86400"

      - name: Upload main build artifacts
        # Browsers revalidate on every load; CloudFront keeps it for a day; CloudFront is invalidated during deployment.
        run: |
          aws s3 cp "dist/prismic-toolbar/$TOOLBAR_VERSION/prismic.js" "s3://${{ secrets.BUCKET_PATH }}/prismic.js" --acl public-read --cache-control "public, max-age=0, s-maxage=86400"
          aws s3 cp "dist/prismic-toolbar/$TOOLBAR_VERSION/prismic.js" "s3://${{ secrets.BUCKET_PATH }}/prismic.min.js" --acl public-read --cache-control "public, max-age=0, s-maxage=86400"

      - name: Invalidate cache
        run: aws cloudfront create-invalidation --distribution-id "${{ secrets.CLOUDFRONT_ID }}" --paths /prismic.js /prismic.min.js
