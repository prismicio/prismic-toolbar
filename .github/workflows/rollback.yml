name: Rollback
run-name: Rollback toolbar to ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Deploy to restore: a commit's first 8 characters (e.g. 1a2b3c4d), or a 4.x version (e.g. 4.1.12)"
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0, fixed commit for security reasons
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Restore main build artifacts
        run: |
          aws s3 cp "s3://${{ secrets.BUCKET_PATH }}/$VERSION/prismic.js" "s3://${{ secrets.BUCKET_PATH }}/prismic.js" --copy-props metadata-directive --acl public-read --cache-control "public, max-age=0, s-maxage=86400"
          aws s3 cp "s3://${{ secrets.BUCKET_PATH }}/$VERSION/prismic.js" "s3://${{ secrets.BUCKET_PATH }}/prismic.min.js" --copy-props metadata-directive --acl public-read --cache-control "public, max-age=0, s-maxage=86400"

      - name: Invalidate cache
        run: aws cloudfront create-invalidation --distribution-id "${{ secrets.CLOUDFRONT_ID }}" --paths /prismic.js /prismic.min.js
